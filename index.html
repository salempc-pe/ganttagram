<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="google" content="notranslate" />
  <meta name="google" content="nositelinkssearchbox" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <title>Ganttagram</title>
</head>

<body>
  <div id="root">
    <div class="loading-screen-initial">
      <div class="loader-wrapper">
        <div class="gantt-loader">
          <div class="g-bar g-bar-1"></div>
          <div class="g-bar g-bar-2"></div>
          <div class="g-bar g-bar-3"></div>
        </div>
      </div>
      <p class="loading-text">Iniciando Ganttagram...</p>
    </div>
  </div>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      /* Color más suave que previene contraste brusco en overscroll mobil */
    }

    .loading-screen-initial {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      z-index: 9999;
    }

    .loader-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gantt-loader {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .g-bar {
      height: 16px;
      border-radius: 8px;
      animation: gantt-slide 1.5s ease-in-out infinite alternate;
    }

    .g-bar-1 {
      width: 60%;
      background: #F87171;
      animation-delay: 0s;
    }

    .g-bar-2 {
      width: 80%;
      background: #60A5FA;
      animation-delay: 0.3s;
      margin-left: 20%;
    }

    .g-bar-3 {
      width: 50%;
      background: #4ADE80;
      animation-delay: 0.6s;
      margin-left: 40%;
    }

    .loading-text {
      margin-top: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      animation: text-fade 1.5s ease-in-out infinite alternate;
    }

    @keyframes gantt-slide {
      from { transform: translateX(-15px); }
      to { transform: translateX(15px); }
    }

    @keyframes text-fade {
      from {
        opacity: 0.4;
        transform: translateY(0);
      }

      to {
        opacity: 1;
        transform: translateY(-2px);
      }
    }
  </style>
  <script>
    window.__APP_LOADED__ = false;

    // Global Error Handler para Móviles
    window.onerror = function (msg, url, line, col, error) {
      showError('Error de JS', msg + '\n' + (url || '').split('/').pop() + ':' + line + ':' + col);
      return false; // Permite que el error se muestre en consola también
    };

    window.addEventListener('unhandledrejection', function (event) {
      showError('Promesa fallida', event.reason);
    });

    function showError(title, detail) {
      var debug = document.getElementById('debug-console');
      if (!debug) {
        debug = document.createElement('div');
        debug.id = 'debug-console';
        debug.style.position = 'fixed';
        debug.style.top = '0';
        debug.style.left = '0';
        debug.style.width = '100%';
        debug.style.height = 'auto';
        debug.style.maxHeight = '50vh';
        debug.style.overflowY = 'auto';
        debug.style.background = 'rgba(220, 38, 38, 0.95)';
        debug.style.color = 'white';
        debug.style.padding = '20px';
        debug.style.zIndex = '99999';
        debug.style.fontFamily = 'monospace';
        debug.style.fontSize = '12px';
        debug.style.whiteSpace = 'pre-wrap';
        debug.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';

        var closeBtn = document.createElement('button');
        closeBtn.innerText = 'CERRAR';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '10px';
        closeBtn.style.right = '10px';
        closeBtn.style.background = 'white';
        closeBtn.style.color = 'black';
        closeBtn.style.border = 'none';
        closeBtn.style.padding = '4px 8px';
        closeBtn.style.borderRadius = '4px';
        closeBtn.style.fontWeight = 'bold';
        closeBtn.onclick = function () { debug.style.display = 'none'; };
        debug.appendChild(closeBtn);

        document.body.appendChild(debug);
      }

      var msgDiv = document.createElement('div');
      msgDiv.style.marginBottom = '10px';
      msgDiv.style.borderBottom = '1px solid rgba(255,255,255,0.3)';
      msgDiv.style.paddingBottom = '10px';
      msgDiv.innerHTML = '<strong>' + title + ':</strong><br>' + String(detail);
      debug.appendChild(msgDiv);
    }
  </script>

  <script type="module" src="/src/main.jsx"
    onerror="showError('Error de Carga Fatal', 'No se pudo cargar /src/main.jsx. Verifica la conexión a internet y el servidor.')"></script>
  <script type="module">
    window.__APP_LOADED__ = true;
  </script>

  <script>
    // Timeout de seguridad: Si en 8 segundos no carga, avisar.
    setTimeout(function () {
      if (!window.__APP_LOADED__) {
        showError(
          'Tiempo de espera agotado',
          'La aplicación está tardando demasiado en iniciar.\n\n' +
          'POSIBLES CAUSAS:\n' +
          '1. Conexión lenta o inestable.\n' +
          '2. Error silencioso al cargar módulos.\n' +
          '3. Falta configuración de entorno.\n\n' +
          'Intenta recargar la página.'
        );
      }
    }, 8000);
  </script>
</body>

</html>
