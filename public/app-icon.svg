<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo Cuadrado -->
    <rect width="512" height="512" fill="#1E1E24"/>
    
    <!-- Grilla Minimalista (4x4) - Líneas en 128, 256, 384 -->
    <g stroke="#2D2D35" stroke-width="2">
        <path d="M128 0V512M256 0V512M384 0V512" />
        <path d="M0 128H512M0 256H512M0 384H512" />
    </g>

    <!-- Barras con Centro alineado al Grid -->
    <!-- Dimensiones: Ancho 320px, Alto 80px (Radio 40px) -->
    
    <!-- Barra Roja: Centro Y = 128 (Top Y = 128 - 40 = 88) -->
    <rect x="32" y="88" width="320" height="80" rx="40" fill="#F87171"/>
    
    <!-- Barra Azul: Centro Y = 256 (Top Y = 256 - 40 = 216) -->
    <rect x="160" y="216" width="320" height="80" rx="40" fill="#60A5FA"/>
    
    <!-- Barra Verde: Centro Y = 384 (Top Y = 384 - 40 = 344) -->
    <rect x="96" y="344" width="320" height="80" rx="40" fill="#4ADE80"/>
</svg>
